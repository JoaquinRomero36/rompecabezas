<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rompecabezas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Rompecabezas</h1>
    <p>Subí una foto, elegí la dificultad y armá tu rompecabezas</p>
  </header>

  <main>
    <section id="setup">
      <div id="upload-area" tabindex="0" role="button" aria-label="Subir imagen">
        <input type="file" id="file-input" accept="image/*" hidden>
        <div id="upload-prompt">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
          <p>Hacé clic o arrastrá una imagen acá</p>
        </div>
        <img id="preview" alt="Vista previa" hidden>
      </div>

      <div id="difficulty" hidden>
        <h2>Elegí la dificultad</h2>
        <div class="difficulty-buttons">
          <button data-cols="3" data-rows="3">Fácil (3×3)</button>
          <button data-cols="4" data-rows="4" class="selected">Medio (4×4)</button>
          <button data-cols="5" data-rows="5">Difícil (5×5)</button>
          <button data-cols="6" data-rows="6">Experto (6×6)</button>
        </div>
        <button id="start-btn" class="primary">Armar rompecabezas</button>
        <button id="change-img-btn" class="secondary">Cambiar imagen</button>
      </div>
    </section>

    <section id="game" hidden>
      <div id="game-header">
        <div id="timer">00:00</div>
        <div id="moves">0 movimientos</div>
        <button id="shuffle-btn" class="secondary">Mezclar</button>
        <button id="back-btn" class="secondary">Volver</button>
      </div>
      <div id="puzzle-container">
        <div id="board"></div>
        <div id="pieces"></div>
      </div>
      <div id="reference-panel" hidden>
        <h3>Referencia</h3>
        <img id="reference-img" alt="Imagen de referencia">
        <button id="toggle-ref" class="secondary">Mostrar referencia</button>
      </div>
    </section>

    <div id="complete-modal" hidden>
      <div class="modal-content">
        <h2>¡Felicidades!</h2>
        <p id="completion-stats"></p>
        <button id="play-again-btn" class="primary">Jugar de nuevo</button>
        <button id="new-puzzle-btn" class="secondary">Nuevo rompecabezas</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
